services:
  telegram-bot-api:
    image: ghcr.io/avbor/docker-telegram-bot-api@sha256:d101a9bb81d8a29a7432dbe3f6d6a8785318f1c09dc2ef4a31e43bfd67794fa6
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    command:
      - --local
      - --http-port=8081
      - --http-stat-port=8082
      - --dir=/var/lib/telegram-bot-api
      - --temp-dir=/var/lib/telegram-bot-api/temp
      - --verbosity=1
      - --tdlib-proxy-type=mtproto
      - --proxy-server=${TELEGRAM_PROXY_SERVER}
      - --proxy-port=${TELEGRAM_PROXY_PORT}
      - --proxy-secret=${TELEGRAM_PROXY_SECRET}
    volumes:
      - telegram_data:/var/lib/telegram-bot-api
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082 >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_hub}
      POSTGRES_USER: ${POSTGRES_USER:-it_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-it_hub} -d ${POSTGRES_DB:-it_hub}"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      telegram-bot-api:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-it_hub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-it_hub}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Администратор}
      APP_URL: ${APP_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_API_BASE_URL: http://telegram-bot-api:8081
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:8092:3000"
volumes:
  postgres_data:
  uploads_data:
  telegram_data:
